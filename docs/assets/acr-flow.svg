<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1500" viewBox="0 0 1240 1500" font-family="'Segoe UI', sans-serif">
<rect width="1240" height="1500" fill="#0d1117"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e6edf3"/></marker></defs>
<text x="40" y="52" font-size="28" fill="#e6edf3" font-family="'Segoe UI', sans-serif" font-weight="bold" text-anchor="start">The .acr companion — anatomy and both paths</text>
<text x="40" y="82" font-size="14.5" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">reverse-engineered (§6.8) · reader: scripts/acr_reader.py · counts from the real export</text>
<rect x="40" y="110" width="1160" height="560" rx="14" fill="#161b22" stroke="#ffa657" stroke-width="2"/>
<text x="60" y="142" font-size="15" fill="#ffa657" font-family="'Segoe UI', sans-serif" font-weight="bold" text-anchor="start">ANATOMY — byte map (DSC03049.acr, 2,533,768 bytes, 11 records; same layout in 77 files)</text>
<text x="80" y="170" font-size="14.5" fill="#d2a8ff" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" text-anchor="start">0x00</text>
<text x="150" y="170" font-size="14.5" fill="#8b949e" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" text-anchor="start">41 43 52 00</text>
<text x="330" y="170" font-size="13.5" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">magic "ACR\0"</text>
<text x="80" y="200" font-size="14.5" fill="#d2a8ff" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" text-anchor="start">0x04</text>
<text x="150" y="200" font-size="14.5" fill="#8b949e" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" text-anchor="start">01 00 00 00</text>
<text x="330" y="200" font-size="13.5" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">version = 1</text>
<text x="80" y="230" font-size="14.5" fill="#d2a8ff" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" text-anchor="start">0x08</text>
<text x="150" y="230" font-size="14.5" fill="#8b949e" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" text-anchor="start">41 52 57 00</text>
<text x="330" y="230" font-size="13.5" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">source-format tag "ARW\0"</text>
<text x="80" y="260" font-size="14.5" fill="#d2a8ff" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" text-anchor="start">0x0C</text>
<text x="150" y="260" font-size="14.5" fill="#ffa657" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" text-anchor="start">0b 00 00 00</text>
<text x="330" y="260" font-size="13.5" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">N = 11 records · then u32 0 (reserved)</text>
<text x="80" y="290" font-size="14.5" fill="#d2a8ff" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" text-anchor="start">0x14</text>
<text x="150" y="290" font-size="14.5" fill="#58a6ff" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" text-anchor="start">11 × 32 B</text>
<text x="330" y="290" font-size="13.5" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">record table, sorted by md5: md5[16] | u64 size | u64 offset</text>
<text x="80" y="320" font-size="14.5" fill="#d2a8ff" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" text-anchor="start"></text>
<text x="150" y="320" font-size="14.5" fill="#58a6ff" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" text-anchor="start">           </text>
<text x="330" y="320" font-size="13.5" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">md5 = crs:MaskDigest / crs:pm_patch* / crs:IngestInfo in the XMP</text>
<text x="80" y="350" font-size="14.5" fill="#d2a8ff" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" text-anchor="start">0x174</text>
<text x="150" y="350" font-size="14.5" fill="#e6edf3" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" text-anchor="start">record 0</text>
<text x="330" y="350" font-size="13.5" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">at 20 + 32×N; records 4-byte aligned, located via the table</text>
<text x="80" y="380" font-size="14.5" fill="#d2a8ff" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" text-anchor="start"></text>
<text x="150" y="380" font-size="14.5" fill="#7ee787" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" text-anchor="start">10 raster</text>
<text x="330" y="380" font-size="13.5" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">16-byte signature 02 00 00 00 01 00 00 00 + 8×00, then a JPEG-XL TIFF</text>
<text x="80" y="410" font-size="14.5" fill="#d2a8ff" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" text-anchor="start"></text>
<text x="150" y="410" font-size="14.5" fill="#ffa657" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" text-anchor="start">1 zlib</text>
<text x="330" y="410" font-size="13.5" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">u32 inflated length + zlib: a 12-byte frame + XMP packet (the receipt)</text>
<text x="80" y="446" font-size="13.5" fill="#8b949e" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="normal" text-anchor="start">TIFFs: single-channel grayscale (some 3-channel 16-bit) · compression tag 52546 = JPEGXL_DNG</text>
<text x="80" y="470" font-size="13.5" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">→ PIL refuses them; decode with tifffile + imagecodecs · each raster cropped to its mask, placed by XMP Origin</text>
<rect x="40" y="700" width="1160" height="700" rx="14" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<text x="60" y="732" font-size="15" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-weight="bold" text-anchor="start">TWO WAYS TO GET THE MASK RASTERS</text>
<rect x="70" y="760" width="540" height="150" rx="14" fill="#161b22" stroke="#7ee787" stroke-width="2"/>
<text x="90" y="792" font-size="16" fill="#7ee787" font-family="'Segoe UI', sans-serif" font-weight="bold" text-anchor="start">cloud export path</text>
<text x="90" y="820" font-size="14" fill="#e6edf3" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">Lightroom “original + settings” export</text>
<text x="90" y="846" font-size="13.5" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">manufactures the container on the fly —</text>
<text x="90" y="870" font-size="13.5" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">full fidelity, straight from the cloud</text>
<rect x="70" y="960" width="540" height="170" rx="14" fill="#0e1a10" stroke="#7ee787" stroke-width="3"/>
<text x="90" y="992" font-size="15" fill="#7ee787" font-family="'Segoe UI', sans-serif" font-weight="bold" text-anchor="start">the export trio</text>
<text x="90" y="1020" font-size="15" fill="#e6edf3" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="normal" text-anchor="start">DSCxxxxx.ARW   the pixels</text>
<text x="90" y="1048" font-size="15" fill="#e6edf3" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="normal" text-anchor="start">DSCxxxxx.xmp   the recipe (bare, no envelope)</text>
<text x="90" y="1076" font-size="15" fill="#7ee787" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" text-anchor="start">DSCxxxxx.acr   the mask molds — real container</text>
<text x="90" y="1106" font-size="13.5" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">written iff the edit has AI masks (84/84 sidecars checked)</text>
<line x1="340" y1="914" x2="340" y2="954" stroke="#7ee787" stroke-width="2" marker-end="url(#arr)"/>
<rect x="640" y="760" width="540" height="150" rx="14" fill="#161b22" stroke="#d2a8ff" stroke-width="2"/>
<text x="660" y="792" font-size="16" fill="#d2a8ff" font-family="'Segoe UI', sans-serif" font-weight="bold" text-anchor="start">offline path (lockout)</text>
<text x="660" y="820" font-size="14" fill="#e6edf3" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="normal" text-anchor="start">auxiliary\ store — 4,504 type-02 rasters</text>
<text x="660" y="846" font-size="13.5" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">already on disk; never packaged as .acr</text>
<rect x="640" y="960" width="540" height="120" rx="14" fill="#161b22" stroke="#d2a8ff" stroke-width="2"/>
<text x="660" y="992" font-size="15" fill="#d2a8ff" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" text-anchor="start">purgeCandidates aux rows</text>
<text x="660" y="1020" font-size="13.5" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">digest + assetId — the join needs no other table</text>
<text x="660" y="1048" font-size="14.5" fill="#e6edf3" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" text-anchor="start">08_assemble_mask_rasters.py</text>
<line x1="910" y1="914" x2="910" y2="954" stroke="#d2a8ff" stroke-width="2" marker-end="url(#arr)"/>
<rect x="640" y="1130" width="540" height="190" rx="14" fill="#171021" stroke="#d2a8ff" stroke-width="3"/>
<text x="660" y="1162" font-size="15" fill="#d2a8ff" font-family="'Segoe UI', sans-serif" font-weight="bold" text-anchor="start">functional equivalent</text>
<text x="660" y="1190" font-size="14" fill="#e6edf3" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="normal" text-anchor="start">mask-rasters\&lt;date&gt;_&lt;RAW&gt;_&lt;n&gt;.tif  (4,448 attributed</text>
<text x="660" y="1216" font-size="13.5" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">across 1,219 photos)</text>
<text x="660" y="1246" font-size="14" fill="#e6edf3" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="normal" text-anchor="start">                     + decoded .png   (100%)</text>
<text x="660" y="1276" font-size="13.5" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">same records, different boxing —</text>
<text x="660" y="1298" font-size="13.5" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">only the .acr box is made at export time</text>
<line x1="910" y1="1084" x2="910" y2="1124" stroke="#d2a8ff" stroke-width="2" marker-end="url(#arr)"/>
<rect x="70" y="1430" width="1100" height="46" rx="14" fill="#161b22" stroke="#7A8899" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="90" y="1459" font-size="14" fill="#8b949e" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="normal" text-anchor="start">read any .acr yourself:  python scripts/acr_reader.py &lt;file.acr&gt; --png   → dumps records, extracts viewable rasters</text>
</svg>