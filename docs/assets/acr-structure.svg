<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1180" viewBox="0 0 1320 1180" font-family="'Segoe UI', sans-serif">
<rect width="1320" height="1180" fill="#0d1117"/>
<text x="40" y="50" font-size="28" fill="#e6edf3" font-family="'Segoe UI', sans-serif" font-weight="bold" text-anchor="start">Anatomy of a .acr file — the mask-raster container</text>
<text x="40" y="80" font-size="15" fill="#8b949e" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="normal" text-anchor="start">DSC09053.acr · 220,036 bytes · 4 records · every offset real</text>
<rect x="46" y="110" width="498" height="1000" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<text x="60" y="138" font-size="14" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-weight="bold" text-anchor="start">LINEAR MAP</text>
<rect x="536" y="160.0" width="14" height="2.0" fill="#d2a8ff"/>
<rect x="536" y="160.6" width="14" height="380.7" fill="#7ee787"/>
<rect x="536" y="541.3" width="14" height="170.9" fill="#7ee787"/>
<rect x="536" y="712.2" width="14" height="75.6" fill="#7ee787"/>
<rect x="536" y="787.8" width="14" height="252.2" fill="#7ee787"/>
<text x="558" y="168" font-size="11" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">to</text>
<text x="558" y="182" font-size="11" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">scale</text>
<rect x="60" y="160" width="470" height="64" rx="10" fill="#161b22" stroke="#d2a8ff" stroke-width="2"/>
<text x="76" y="188" font-size="15.5" fill="#d2a8ff" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" text-anchor="start">header</text>
<text x="76" y="212" font-size="12.5" fill="#8b949e" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="normal" text-anchor="start">magic · version · fmt · id · dir</text>
<text x="516" y="188" font-size="13" fill="#d2a8ff" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" text-anchor="end">@0x0</text>
<text x="516" y="212" font-size="12" fill="#8b949e" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="normal" text-anchor="end">148 B</text>
<rect x="60" y="238" width="470" height="78" rx="10" fill="#161b22" stroke="#7ee787" stroke-width="2"/>
<text x="76" y="266" font-size="15.5" fill="#7ee787" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" text-anchor="start">record 0</text>
<text x="76" y="290" font-size="12.5" fill="#8b949e" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="normal" text-anchor="start">16 B sig + TIFF  1128x1920</text>
<text x="516" y="266" font-size="13" fill="#d2a8ff" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" text-anchor="end">@0x94</text>
<text x="516" y="290" font-size="12" fill="#8b949e" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="normal" text-anchor="end">95,116 B</text>
<rect x="60" y="330" width="470" height="78" rx="10" fill="#161b22" stroke="#7ee787" stroke-width="2"/>
<text x="76" y="358" font-size="15.5" fill="#7ee787" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" text-anchor="start">record 1</text>
<text x="76" y="382" font-size="12.5" fill="#8b949e" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="normal" text-anchor="start">16 B sig + TIFF  1597x1122</text>
<text x="516" y="358" font-size="13" fill="#d2a8ff" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" text-anchor="end">@0x17430</text>
<text x="516" y="382" font-size="12" fill="#8b949e" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="normal" text-anchor="end">42,692 B</text>
<rect x="60" y="422" width="470" height="78" rx="10" fill="#161b22" stroke="#7ee787" stroke-width="2"/>
<text x="76" y="450" font-size="15.5" fill="#7ee787" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" text-anchor="start">record 2</text>
<text x="76" y="474" font-size="12.5" fill="#8b949e" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="normal" text-anchor="start">16 B sig + TIFF  1323x1920</text>
<text x="516" y="450" font-size="13" fill="#d2a8ff" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" text-anchor="end">@0x21B04</text>
<text x="516" y="474" font-size="12" fill="#8b949e" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="normal" text-anchor="end">18,876 B</text>
<rect x="60" y="514" width="470" height="78" rx="10" fill="#161b22" stroke="#7ee787" stroke-width="2"/>
<text x="76" y="542" font-size="15.5" fill="#7ee787" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" text-anchor="start">record 3</text>
<text x="76" y="566" font-size="12.5" fill="#8b949e" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="normal" text-anchor="start">16 B sig + TIFF  2880x1920</text>
<text x="516" y="542" font-size="13" fill="#d2a8ff" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" text-anchor="end">@0x264D0</text>
<text x="516" y="566" font-size="12" fill="#8b949e" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="normal" text-anchor="end">63,140 B</text>
<text x="60" y="630" font-size="13.5" fill="#8b949e" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" text-anchor="start">EOF  0x35B04</text>
<text x="60" y="654" font-size="12.5" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">no length fields anywhere —</text>
<text x="60" y="674" font-size="12.5" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">each record ends where the next</text>
<text x="60" y="694" font-size="12.5" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">signature begins (or EOF)</text>
<rect x="640" y="110" width="620" height="330" rx="10" fill="#161b22" stroke="#d2a8ff" stroke-width="2"/>
<text x="660" y="140" font-size="14" fill="#d2a8ff" font-family="'Segoe UI', sans-serif" font-weight="bold" text-anchor="start">HEADER ZOOM  (0x00–0x93)</text>
<text x="660" y="166" font-size="13.5" fill="#d2a8ff" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" text-anchor="start">0x00</text>
<text x="716" y="166" font-size="12.5" fill="#8b949e" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="normal" text-anchor="start">4 B</text>
<text x="768" y="166" font-size="13" fill="#e6edf3" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">magic "ACR\0"</text>
<text x="660" y="196" font-size="13.5" fill="#d2a8ff" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" text-anchor="start">0x04</text>
<text x="716" y="196" font-size="12.5" fill="#8b949e" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="normal" text-anchor="start">4 B</text>
<text x="768" y="196" font-size="13" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">u32 version = 1</text>
<text x="660" y="226" font-size="13.5" fill="#d2a8ff" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" text-anchor="start">0x08</text>
<text x="716" y="226" font-size="12.5" fill="#8b949e" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="normal" text-anchor="start">4 B</text>
<text x="768" y="226" font-size="13" fill="#e6edf3" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">source-format tag "ARW\0"</text>
<text x="660" y="256" font-size="13.5" fill="#d2a8ff" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" text-anchor="start">0x0C</text>
<text x="716" y="256" font-size="12.5" fill="#8b949e" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="normal" text-anchor="start">8 B</text>
<text x="768" y="256" font-size="13" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">u32 4 · u32 0 — unknown flags</text>
<text x="660" y="286" font-size="13.5" fill="#d2a8ff" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" text-anchor="start">0x14</text>
<text x="716" y="286" font-size="12.5" fill="#8b949e" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="normal" text-anchor="start">20 B</text>
<text x="768" y="286" font-size="13" fill="#ff7b72" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">id — NOT sha1(ARW), NOT sha1(XMP): tested</text>
<text x="660" y="316" font-size="13.5" fill="#d2a8ff" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" text-anchor="start">0x2C</text>
<text x="716" y="316" font-size="12.5" fill="#8b949e" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="normal" text-anchor="start">4 B</text>
<text x="768" y="316" font-size="13" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">u32 0</text>
<text x="660" y="346" font-size="13.5" fill="#d2a8ff" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" text-anchor="start">0x30</text>
<text x="716" y="346" font-size="12.5" fill="#8b949e" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="normal" text-anchor="start">4 B</text>
<text x="768" y="346" font-size="13" fill="#58a6ff" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">first-record offset = 0x94</text>
<text x="660" y="376" font-size="13.5" fill="#d2a8ff" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" text-anchor="start">0x34</text>
<text x="716" y="376" font-size="12.5" fill="#8b949e" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="normal" text-anchor="start">96 B</text>
<text x="768" y="376" font-size="13" fill="#7A8899" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">directory region — entries unmapped</text>
<rect x="640" y="470" width="620" height="400" rx="10" fill="#161b22" stroke="#7ee787" stroke-width="2"/>
<text x="660" y="500" font-size="14" fill="#7ee787" font-family="'Segoe UI', sans-serif" font-weight="bold" text-anchor="start">RECORD ZOOM  (record 0 @ 0x94)</text>
<text x="660" y="528" font-size="13" fill="#e6edf3" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="normal" text-anchor="start">+0x00  16 B signature:  02 00 00 00 01 00 00 00 00 00 00 00 00 00 00 00</text>
<text x="660" y="556" font-size="13" fill="#e6edf3" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="normal" text-anchor="start">+0x10  TIFF — same layout as the auxiliary\ type-02 records</text>
<text x="660" y="588" font-size="13.5" fill="#7ee787" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" text-anchor="start">IFD0 (12 entries):</text>
<text x="676" y="614" font-size="12.5" fill="#8b949e" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="normal" text-anchor="start">0x00FE NewSubfileType = 0</text>
<text x="676" y="640" font-size="12.5" fill="#8b949e" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="normal" text-anchor="start">0x0100 ImageWidth = 1128   0x0101 ImageLength = 1920</text>
<text x="676" y="666" font-size="12.5" fill="#8b949e" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="normal" text-anchor="start">0x0102 BitsPerSample = 8   0x0115 SamplesPerPixel = 1</text>
<text x="676" y="692" font-size="12.5" fill="#ffa657" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="normal" text-anchor="start">0x0103 Compression = 52546 = JPEGXL_DNG</text>
<text x="676" y="718" font-size="12.5" fill="#8b949e" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="normal" text-anchor="start">0x0106 Photometric = 1 (BlackIsZero) — a mask, not a picture</text>
<text x="676" y="744" font-size="12.5" fill="#8b949e" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="normal" text-anchor="start">0x0142 TileWidth = 1128   0x0143 TileLength = 1920 (one tile)</text>
<text x="676" y="770" font-size="12.5" fill="#e6edf3" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="normal" text-anchor="start">0x0144 TileOffsets → JPEG-XL tile data   0x0145 TileByteCounts</text>
<text x="660" y="802" font-size="12" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">some records: 3-channel 16-bit — per-mask resolution varies</text>
<rect x="640" y="900" width="620" height="210" rx="10" fill="#161b22" stroke="#7A8899" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="660" y="930" font-size="14" fill="#7A8899" font-family="'Segoe UI', sans-serif" font-weight="bold" text-anchor="start">HOW TO WALK IT</text>
<text x="660" y="958" font-size="13" fill="#8b949e" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="normal" text-anchor="start">1. verify magic ACR\0 · read first-record offset @0x30</text>
<text x="660" y="986" font-size="13" fill="#8b949e" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="normal" text-anchor="start">2. at each record: check 16-byte signature, then II*\0</text>
<text x="660" y="1014" font-size="13" fill="#8b949e" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="normal" text-anchor="start">3. record ends at the NEXT signature (scan for it) or EOF</text>
<text x="660" y="1042" font-size="13" fill="#8b949e" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="normal" text-anchor="start">4. each TIFF is standalone — strip 16 bytes, save it</text>
<text x="660" y="1070" font-size="13" fill="#8b949e" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="normal" text-anchor="start">5. decode tiles: pip install tifffile imagecodecs (JXL)</text>
<text x="660" y="1098" font-size="13.5" fill="#e6edf3" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" text-anchor="start">automated: scripts/acr_reader.py &lt;file.acr&gt; --png</text>
</svg>