<path d="M 556 211 C 496.0 211, 496.0 486, 442 486" fill="none" stroke="#E8555A" stroke-width="1.8" stroke-dasharray="" marker-end="url(#arr-sub)" opacity="0.9"/>
<path d="M 556 326 C 496.0 326, 496.0 288, 442 288" fill="none" stroke="#7A8899" stroke-width="1.8" stroke-dasharray="" marker-end="url(#arr-maker)" opacity="0.9"/>
<path d="M 556 444 C 496.0 444, 496.0 430, 442 430" fill="none" stroke="#7A8899" stroke-width="1.8" stroke-dasharray="6 3" marker-end="url(#arr-ifd1)" opacity="0.9"/>
<path d="M 556 465 C 496.0 465, 496.0 596, 442 596" fill="none" stroke="#F2A93B" stroke-width="1.8" stroke-dasharray="" marker-end="url(#arr-jpeg)" opacity="0.9"/>
<path d="M 556 584 C 496.0 584, 496.0 697, 442 697" fill="none" stroke="#5ABF8A" stroke-width="1.8" stroke-dasharray="" marker-end="url(#arr-strip)" opacity="0.9"/>
<text x="560" y="702" font-size="11" fill="#6B7686">offsets in monospace are byte offsets into the file · arrow colour = destination block</text>
</svg>