<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1760" viewBox="0 0 1180 1760" font-family="'Segoe UI', sans-serif">
<rect width="1180" height="1760" fill="#0d1117"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e6edf3"/></marker></defs>
<text x="40" y="52" font-size="28" fill="#e6edf3" font-family="'Segoe UI', sans-serif" font-weight="bold" text-anchor="start">How the Catalog ↔ XMP linkage was found — the forensic path</text>
<text x="40" y="82" font-size="15" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">reconstruction of the actual investigation · dead ends included · numbers from the real recovery</text>
<rect x="190" y="110" width="800" height="84" rx="14" fill="#161b22" stroke="#7A8899" stroke-width="2"/>
<text x="590" y="144" font-size="17" fill="#e6edf3" font-family="'Segoe UI', sans-serif" font-weight="bold" text-anchor="middle">~630 photos edited (versions table)</text>
<text x="590" y="172" font-size="14" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="middle">but every develop setting is invisible — where do the edits physically live?</text>
<line x1="590" y1="198" x2="590" y2="240" stroke="#e6edf3" stroke-width="2" marker-end="url(#arr)"/>
<text x="740" y="226" font-size="13.5" fill="#e6edf3" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" text-anchor="middle">the obvious candidates first</text>
<rect x="90" y="246" width="460" height="92" rx="14" fill="#161b22" stroke="#ff7b72" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="110" y="276" font-size="17" fill="#ff7b72" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" text-anchor="start">xmp\</text>
<text x="110" y="302" font-size="13.5" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">the folder literally named for it —</text>
<text x="110" y="324" font-size="13.5" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">0 files</text>
<rect x="630" y="246" width="460" height="92" rx="14" fill="#161b22" stroke="#ff7b72" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="650" y="276" font-size="17" fill="#ff7b72" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" text-anchor="start">big_table_cache\</text>
<text x="650" y="302" font-size="13.5" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">the general blob cache —</text>
<text x="650" y="324" font-size="13.5" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">0 files</text>
<rect x="240" y="372" width="700" height="74" rx="14" fill="#1a0f0d" stroke="#ff7b72" stroke-width="1.6"/>
<text x="590" y="402" font-size="14.5" fill="#ff7b72" font-family="'Segoe UI', sans-serif" font-weight="bold" text-anchor="middle">early — wrong — conclusion:</text>
<text x="590" y="428" font-size="15" fill="#8b949e" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="normal" text-anchor="middle">“most edit settings are cloud-only”</text>
<line x1="590" y1="450" x2="590" y2="492" stroke="#d2a8ff" stroke-width="2" marker-end="url(#arr)"/>
<text x="760" y="478" font-size="13.5" fill="#d2a8ff" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" text-anchor="middle">but Adobe's own bookkeeping disagreed …</text>
<rect x="140" y="498" width="900" height="122" rx="14" fill="#161b22" stroke="#d2a8ff" stroke-width="2"/>
<text x="160" y="528" font-size="15" fill="#d2a8ff" font-family="'Segoe UI', sans-serif" font-weight="bold" text-anchor="start">the census query — purgeCandidates</text>
<text x="160" y="556" font-size="14" fill="#e6edf3" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="normal" text-anchor="start">SELECT binaryType, COUNT(*), SUM(hasLocalFile) FROM purgeCandidates GROUP BY 1</text>
<text x="160" y="584" font-size="15" fill="#7ee787" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" text-anchor="start">xmp_develop:  3,457 rows  ·  2,123 flagged hasLocalFile=1</text>
<text x="160" y="608" font-size="14" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">Adobe's own index claims 2,123 develop XMPs exist ON THIS MACHINE</text>
<line x1="590" y1="626" x2="590" y2="668" stroke="#58a6ff" stroke-width="2" marker-end="url(#arr)"/>
<text x="790" y="654" font-size="13.5" fill="#58a6ff" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" text-anchor="middle">index says local → the files exist → stop guessing folders</text>
<rect x="190" y="674" width="800" height="104" rx="14" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
<text x="210" y="704" font-size="15" fill="#58a6ff" font-family="'Segoe UI', sans-serif" font-weight="bold" text-anchor="start">the 4-line census that should have run first</text>
<text x="210" y="730" font-size="14" fill="#e6edf3" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="normal" text-anchor="start">os.walk the whole tree · keep names matching ^[0-9a-f]{64}$</text>
<text x="210" y="758" font-size="13.5" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">no assumptions about what any folder is “for”</text>
<line x1="590" y1="784" x2="590" y2="826" stroke="#ffa657" stroke-width="2" marker-end="url(#arr)"/>
<text x="730" y="812" font-size="13.5" fill="#ffa657" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" text-anchor="middle">2,592 hits — all in one folder</text>
<rect x="140" y="832" width="900" height="118" rx="14" fill="#1f1608" stroke="#ffa657" stroke-width="3"/>
<text x="160" y="864" font-size="22" fill="#ffa657" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" text-anchor="start">settings\</text>
<text x="160" y="892" font-size="15" fill="#e6edf3" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">2,648 extensionless files named by 64-hex sha256</text>
<text x="160" y="918" font-size="13.5" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">the folder skipped for hours because its name sounded like app preferences</text>
<text x="160" y="938" font-size="12" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start"></text>
<line x1="590" y1="958" x2="590" y2="1000" stroke="#7ee787" stroke-width="2" marker-end="url(#arr)"/>
<text x="780" y="986" font-size="13.5" fill="#7ee787" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" text-anchor="middle">so is the column in the index the same thing?</text>
<rect x="140" y="1006" width="900" height="122" rx="14" fill="#0e1a10" stroke="#7ee787" stroke-width="3"/>
<text x="160" y="1038" font-size="17" fill="#7ee787" font-family="'Segoe UI', sans-serif" font-weight="bold" text-anchor="start">the decisive test</text>
<text x="160" y="1066" font-size="15" fill="#e6edf3" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="normal" text-anchor="start">contentIdOrSha256 values  vs  actual filenames in settings\</text>
<text x="160" y="1094" font-size="15.5" fill="#7ee787" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" text-anchor="start">2,123/2,123 rows resolve · 1,345/1,345 distinct shas — 100%, zero misses</text>
<text x="160" y="1118" font-size="13.5" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">no decoding, no hashing: one SQL row is the entire linkage</text>
<line x1="590" y1="1136" x2="590" y2="1178" stroke="#7ee787" stroke-width="2" marker-end="url(#arr)"/>
<text x="800" y="1164" font-size="13.5" fill="#7ee787" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" text-anchor="middle">and the payloads are what Adobe documents them to be</text>
<rect x="190" y="1184" width="800" height="88" rx="14" fill="#161b22" stroke="#7ee787" stroke-width="2"/>
<text x="210" y="1214" font-size="14.5" fill="#7ee787" font-family="'Segoe UI', sans-serif" font-weight="bold" text-anchor="start">content verification (publicly documented)</text>
<text x="210" y="1240" font-size="13.5" fill="#e6edf3" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="normal" text-anchor="start">http://ns.adobe.com/camera-raw-settings/1.0/  +  crs:Exposure2012 present</text>
<text x="210" y="1262" font-size="13.5" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">→ these are Camera Raw develop settings</text>
<line x1="590" y1="1280" x2="590" y2="1322" stroke="#ffa657" stroke-width="2" marker-end="url(#arr)"/>
<text x="680" y="1308" font-size="13.5" fill="#ffa657" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" text-anchor="middle">join it all together</text>
<rect x="140" y="1328" width="900" height="118" rx="14" fill="#1f1608" stroke="#ffa657" stroke-width="3"/>
<text x="160" y="1360" font-size="16" fill="#ffa657" font-family="'Segoe UI', sans-serif" font-weight="bold" text-anchor="start">the linkage, productized</text>
<text x="160" y="1388" font-size="14" fill="#e6edf3" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="normal" text-anchor="start">purgeCandidates.assetId + assets.filename + assetPathsAndInfo.path</text>
<text x="160" y="1414" font-size="14.5" fill="#7ee787" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">1,952 named sidecars · every edited photo covered · counts reconcile</text>
<text x="160" y="1438" font-size="13" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">current revision by dateLastUpdatedInSeconds · wrap() adds the xpacket envelope</text>
<line x1="590" y1="1446" x2="590" y2="1486" stroke="#e6edf3" stroke-width="2" marker-end="url(#arr)"/>
<rect x="90" y="1492" width="1000" height="100" rx="14" fill="#0e1a10" stroke="#7ee787" stroke-width="2"/>
<text x="110" y="1522" font-size="14.5" fill="#7ee787" font-family="'Segoe UI', sans-serif" font-weight="bold" text-anchor="start">epilogue — after access was restored, a real export</text>
<text x="110" y="1548" font-size="13.5" fill="#e6edf3" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="normal" text-anchor="start">"original + settings" emitted .acr companions — same type-02 records as auxiliary\:</text>
<text x="110" y="1572" font-size="13.5" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">the "TIFF renditions" finally had their name — mask rasters (§6.8, step 08)</text>
<rect x="90" y="1620" width="1000" height="96" rx="14" fill="#161b22" stroke="#ff7b72" stroke-width="1.6" stroke-dasharray="8 5"/>
<text x="110" y="1650" font-size="14.5" fill="#ff7b72" font-family="'Segoe UI', sans-serif" font-weight="bold" text-anchor="start">the lesson</text>
<text x="110" y="1676" font-size="15" fill="#e6edf3" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" text-anchor="start">the index was right both times — the search was wrong</text>
<text x="110" y="1702" font-size="13" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">enumerate every folder before assigning semantics to its name · full story: walkthrough.md steps 3–6</text>
</svg>