<defs><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e6edf3"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffa657"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ee787"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d2a8ff"/></marker><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/></marker></defs>
<text x="40" y="50" font-size="26" fill="#e6edf3" font-family="'Segoe UI', sans-serif" font-weight="bold" text-anchor="start">When does the export write an .acr?</text>
<text x="40" y="80" font-size="14.5" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">84 export sidecars checked; the rule held for every one</text>
<rect x="40" y="200" width="220" height="90" rx="12" fill="#161b22" stroke="#7A8899" stroke-width="2"/>
<text x="150" y="238" font-size="17" fill="#e6edf3" font-family="'Segoe UI', sans-serif" font-weight="bold" text-anchor="middle">export</text>
<text x="150" y="264" font-size="15" fill="#8b949e" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="normal" text-anchor="middle">84 sidecars</text>
<polygon points="470,145 640,245 470,345 300,245" fill="#161b22" stroke="#ffa657" stroke-width="2.5"/>
<text x="470" y="237" font-size="16" fill="#e6edf3" font-family="'Segoe UI', sans-serif" font-weight="bold" text-anchor="middle">XMP has an</text>
<text x="470" y="261" font-size="16" fill="#e6edf3" font-family="'Segoe UI', sans-serif" font-weight="bold" text-anchor="middle">AI mask?</text>
<text x="470" y="287" font-size="12.5" fill="#8b949e" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="normal" text-anchor="middle">crs:What="Mask/Image"</text>
<line x1="260" y1="245" x2="296" y2="245" stroke="#8b949e" stroke-width="2" marker-end="url(#ad)"/>
<rect x="800" y="120" width="400" height="110" rx="12" fill="#0e1a10" stroke="#7ee787" stroke-width="3"/>
<text x="820" y="156" font-size="18" fill="#7ee787" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" text-anchor="start">ARW + XMP + ACR</text>
<text x="820" y="184" font-size="15" fill="#e6edf3" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">77 of 77</text>
<text x="820" y="208" font-size="13.5" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">Remove and Generative Remove patches ride along (3 files)</text>
