<text x="820" y="306" font-size="18" fill="#e6edf3" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" text-anchor="start">ARW + XMP</text>
<text x="820" y="334" font-size="15" fill="#e6edf3" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">7 of 7</text>
<text x="820" y="358" font-size="13.5" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">no AI mask, no raster, no ACR</text>
<line x1="640" y1="245" x2="720" y2="245" stroke="#8b949e" stroke-width="2"/>
<path d="M 720 245 L 720 175 L 796 175" fill="none" stroke="#7ee787" stroke-width="2" marker-end="url(#ag)"/>
<text x="734" y="205" font-size="15" fill="#7ee787" font-family="'Segoe UI', sans-serif" font-weight="bold" text-anchor="start">yes</text>
<path d="M 720 245 L 720 325 L 796 325" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#ad)"/>
<text x="734" y="300" font-size="15" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-weight="bold" text-anchor="start">no</text>
<text x="40" y="430" font-size="14" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">Gradient, radial, brush and range masks are stored as parameters and never produce a raster.</text>
