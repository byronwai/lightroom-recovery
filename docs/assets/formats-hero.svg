<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" font-family="'Segoe UI', sans-serif">
<rect width="1240" height="560" fill="#0d1117"/>
<defs><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e6edf3"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffa657"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ee787"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d2a8ff"/></marker><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/></marker></defs>
<text x="40" y="50" font-size="26" fill="#e6edf3" font-family="'Segoe UI', sans-serif" font-weight="bold" text-anchor="start">One photo, four formats</text>
<text x="40" y="80" font-size="14.5" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">pixels, decisions, computed results, and the container that can hold them</text>
<rect x="40" y="260" width="210" height="100" rx="12" fill="#161b22" stroke="#7A8899" stroke-width="2"/>
<text x="145" y="302" font-size="17" fill="#e6edf3" font-family="'Segoe UI', sans-serif" font-weight="bold" text-anchor="middle">one edited</text>
<text x="145" y="326" font-size="17" fill="#e6edf3" font-family="'Segoe UI', sans-serif" font-weight="bold" text-anchor="middle">photo</text>
<rect x="370" y="120" width="340" height="100" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
<text x="392" y="156" font-size="22" fill="#58a6ff" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" text-anchor="start">ARW</text>
<text x="470" y="156" font-size="17" fill="#e6edf3" font-family="'Segoe UI', sans-serif" font-weight="bold" text-anchor="start">the pixels</text>
<text x="392" y="190" font-size="14" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">TIFF/EP · written by the camera</text>
<path d="M 250 310 C 310 310, 310 170, 366 170" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#ad)"/>
<rect x="370" y="260" width="340" height="100" rx="12" fill="#161b22" stroke="#d2a8ff" stroke-width="2"/>
<text x="392" y="296" font-size="22" fill="#d2a8ff" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" text-anchor="start">XMP</text>
<text x="470" y="296" font-size="17" fill="#e6edf3" font-family="'Segoe UI', sans-serif" font-weight="bold" text-anchor="start">the decisions</text>
<text x="392" y="330" font-size="14" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">RDF/XML · how to compute each edit</text>
<path d="M 250 310 C 310 310, 310 310, 366 310" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#ad)"/>
<rect x="370" y="400" width="340" height="100" rx="12" fill="#161b22" stroke="#ffa657" stroke-width="3"/>
<text x="392" y="436" font-size="22" fill="#ffa657" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" text-anchor="start">ACR</text>
<text x="470" y="436" font-size="17" fill="#e6edf3" font-family="'Segoe UI', sans-serif" font-weight="bold" text-anchor="start">the computed result</text>
<text x="392" y="470" font-size="14" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">AI-mask rasters · undocumented</text>
<path d="M 250 310 C 310 310, 310 450, 366 450" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#ad)"/>
<rect x="880" y="180" width="320" height="240" rx="12" fill="#161b22" stroke="#7ee787" stroke-width="2"/>
<text x="1040" y="228" font-size="24" fill="#7ee787" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" text-anchor="middle">DNG</text>
<text x="1040" y="258" font-size="17" fill="#e6edf3" font-family="'Segoe UI', sans-serif" font-weight="bold" text-anchor="middle">the container</text>
<text x="1040" y="300" font-size="14" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="middle">Adobe's open RAW format</text>
<text x="1040" y="324" font-size="14" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="middle">can hold the pixels and</text>
<text x="1040" y="348" font-size="14" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="middle">embed the XMP: no sidecar</text>
<line x1="710" y1="170" x2="876" y2="250" stroke="#7ee787" stroke-width="2" marker-end="url(#ag)"/>
<line x1="710" y1="310" x2="876" y2="310" stroke="#7ee787" stroke-width="2" marker-end="url(#ag)"/>
<line x1="710" y1="450" x2="876" y2="370" stroke="#ffa657" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#ao)"/>
<text x="800" y="452" font-size="14" fill="#ffa657" font-family="'Segoe UI', sans-serif" font-weight="bold" text-anchor="middle">can it carry</text>
<text x="800" y="472" font-size="14" fill="#ffa657" font-family="'Segoe UI', sans-serif" font-weight="bold" text-anchor="middle">the rasters? open</text>
</svg>