<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="540" viewBox="0 0 1440 540" font-family="'Segoe UI', sans-serif">
<rect width="1440" height="540" fill="#0d1117"/>
<defs><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e6edf3"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffa657"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7ee787"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d2a8ff"/></marker><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/></marker></defs>
<text x="40" y="50" font-size="26" fill="#e6edf3" font-family="'Segoe UI', sans-serif" font-weight="bold" text-anchor="start">From cache to export to re-import</text>
<text x="40" y="80" font-size="14.5" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">what lives where, and what the .acr changes when the edit comes back</text>
<rect x="40" y="120" width="380" height="330" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<text x="60" y="152" font-size="15" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-weight="bold" text-anchor="start">LrCC local cache</text>
<rect x="60" y="172" width="340" height="110" rx="12" fill="#161b22" stroke="#ffa657" stroke-width="2"/>
<text x="80" y="206" font-size="16" fill="#ffa657" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" text-anchor="start">settings\&lt;sha256&gt;</text>
<text x="80" y="234" font-size="14" fill="#e6edf3" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">bare develop XMPs</text>
<text x="80" y="258" font-size="13" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">named by sha256 of the content</text>
<rect x="60" y="310" width="340" height="120" rx="12" fill="#161b22" stroke="#d2a8ff" stroke-width="2"/>
<text x="80" y="344" font-size="16" fill="#d2a8ff" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" text-anchor="start">auxiliary\&lt;md5&gt;</text>
<text x="80" y="372" font-size="14" fill="#e6edf3" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">AI-mask rasters, Remove patches</text>
<text x="80" y="396" font-size="13" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">one record per file, named by</text>
<text x="80" y="416" font-size="13" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">md5 = the XMP's MaskDigest</text>
<rect x="500" y="230" width="200" height="100" rx="12" fill="#161b22" stroke="#7A8899" stroke-width="2"/>
<text x="600" y="270" font-size="17" fill="#e6edf3" font-family="'Segoe UI', sans-serif" font-weight="bold" text-anchor="middle">export</text>
<text x="600" y="296" font-size="13.5" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="middle">original + settings</text>
<line x1="400" y1="227" x2="496" y2="262" stroke="#ffa657" stroke-width="2" marker-end="url(#ao)"/>
<line x1="400" y1="370" x2="496" y2="300" stroke="#d2a8ff" stroke-width="2" marker-end="url(#ap)"/>
<text x="474" y="410" font-size="13" fill="#d2a8ff" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="middle">packed into</text>
<text x="474" y="428" font-size="13" fill="#d2a8ff" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="middle">the .acr table</text>
<rect x="780" y="190" width="300" height="180" rx="12" fill="#0e1a10" stroke="#7ee787" stroke-width="3"/>
<text x="800" y="226" font-size="16" fill="#7ee787" font-family="'Segoe UI', sans-serif" font-weight="bold" text-anchor="start">trio on disk</text>
<text x="800" y="260" font-size="15" fill="#e6edf3" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="normal" text-anchor="start">DSCxxxxx.ARW</text>
<text x="800" y="288" font-size="15" fill="#e6edf3" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="normal" text-anchor="start">DSCxxxxx.xmp  (bare)</text>
<text x="800" y="316" font-size="15" fill="#7ee787" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" text-anchor="start">DSCxxxxx.acr  (if AI masks)</text>
<text x="800" y="348" font-size="13" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">same folder, same base name</text>
<line x1="700" y1="280" x2="776" y2="280" stroke="#e6edf3" stroke-width="2" marker-end="url(#at)"/>
<rect x="1160" y="150" width="240" height="100" rx="12" fill="#161b22" stroke="#7ee787" stroke-width="2"/>
<text x="1180" y="184" font-size="15" fill="#7ee787" font-family="'Segoe UI', sans-serif" font-weight="bold" text-anchor="start">with the .acr</text>
<text x="1180" y="212" font-size="14" fill="#e6edf3" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">masks restored exactly</text>
<text x="1180" y="234" font-size="13" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">from the stored rasters</text>
<rect x="1160" y="310" width="240" height="120" rx="12" fill="#161b22" stroke="#7A8899" stroke-width="2"/>
<text x="1180" y="344" font-size="15" fill="#e6edf3" font-family="'Segoe UI', sans-serif" font-weight="bold" text-anchor="start">without it</text>
<text x="1180" y="372" font-size="14" fill="#e6edf3" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">masks recomputed</text>
<text x="1180" y="396" font-size="13" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">AI models re-run on the XMP</text>
<text x="1180" y="416" font-size="13" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">close, not always identical</text>
<line x1="1080" y1="250" x2="1156" y2="205" stroke="#7ee787" stroke-width="2" marker-end="url(#ag)"/>
<line x1="1080" y1="310" x2="1156" y2="360" stroke="#8b949e" stroke-width="2" marker-end="url(#ad)"/>
<text x="1240" y="290" font-size="14" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-weight="bold" text-anchor="middle">re-import</text>
</svg>