<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="392" viewBox="0 0 1080 392" font-family="Consolas, 'Cascadia Mono', 'Courier New', monospace">
<rect width="1080" height="392" fill="#0d1117"/>
<text x="28" y="28" font-size="17" font-weight="bold" fill="#e6edf3">Adobe Lightroom (cloud) — local data tree (simplified)</text>
<text x="28" y="55" font-size="15" xml:space="preserve"><tspan fill="#79c0ff">%LOCALAPPDATA%\Adobe\Lightroom CC\</tspan></text>
<text x="28" y="76" font-size="15" xml:space="preserve"><tspan fill="#4d5761">├── </tspan><tspan fill="#79c0ff">Caches\ · Connections\ · Preferences\ · avatar\</tspan><tspan fill="#8b949e">            app state — ignorable</tspan></text>
<text x="28" y="97" font-size="15" xml:space="preserve"><tspan fill="#4d5761">└── </tspan><tspan fill="#79c0ff">Data\&lt;catalog-guid&gt;\</tspan><tspan fill="#8b949e">                      one folder per cloud catalog</tspan></text>
<text x="28" y="118" font-size="15" xml:space="preserve"><tspan fill="#4d5761">    ├── </tspan><tspan fill="#e6edf3">Managed Catalog.mcat</tspan><tspan fill="#8b949e">            document store — sync source of truth</tspan></text>
<text x="28" y="139" font-size="15" xml:space="preserve"><tspan fill="#4d5761">    ├── </tspan><tspan fill="#e6edf3">Managed Catalog.wfindex</tspan><tspan fill="#ffa657">           SQL index — the recovery goldmine</tspan></text>
<text x="28" y="160" font-size="15" xml:space="preserve"><tspan fill="#4d5761">    ├── </tspan><tspan fill="#79c0ff">originals\&lt;year&gt;\&lt;date&gt;\</tspan><tspan fill="#8b949e">             your RAW files</tspan></text>
<text x="28" y="181" font-size="15" xml:space="preserve"><tspan fill="#4d5761">    ├── </tspan><tspan fill="#e6edf3">settings\&lt;64-hex sha256&gt;</tspan><tspan fill="#ffa657">              per-photo develop XMPs</tspan></text>
<text x="28" y="202" font-size="15" xml:space="preserve"><tspan fill="#4d5761">    ├── </tspan><tspan fill="#e6edf3">previews\&lt;shard&gt;\&lt;key&gt;</tspan><tspan fill="#8b949e">              rendered JPEGs — edits baked in</tspan></text>
<text x="28" y="223" font-size="15" xml:space="preserve"><tspan fill="#4d5761">    ├── </tspan><tspan fill="#e6edf3">auxiliary\&lt;digest[:3]&gt;\&lt;digest[3:]&gt;</tspan><tspan fill="#8b949e">       renditions + zlib XMP payloads</tspan></text>
<text x="28" y="244" font-size="15" xml:space="preserve"><tspan fill="#4d5761">    ├── </tspan><tspan fill="#e6edf3">proxies\2560\&lt;assetId&gt;</tspan><tspan fill="#8b949e">              DNG stand-ins — unedited</tspan></text>
<text x="28" y="265" font-size="15" xml:space="preserve"><tspan fill="#4d5761">    ├── </tspan><tspan fill="#e6edf3">cr_settings\&lt;preset-docId&gt;.xmp</tspan><tspan fill="#8b949e">       ACR presets · cr_defaults\ raw defaults</tspan></text>
<text x="28" y="286" font-size="15" xml:space="preserve"><tspan fill="#4d5761">    └── </tspan><tspan fill="#79c0ff">xmp\&lt;shard&gt;\</tspan><tspan fill="#ff7b72">                        empty — the red herring</tspan></text>
<text x="28" y="328" font-size="15" xml:space="preserve"><tspan fill="#ffa657">• = recovery-critical</tspan></text>
</svg>