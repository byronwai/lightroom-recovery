<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1320" viewBox="0 0 1180 1320" font-family="'Segoe UI', sans-serif">
<rect width="1180" height="1320" fill="#0d1117"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e6edf3"/></marker></defs>
<text x="40" y="52" font-size="28" fill="#e6edf3" font-family="'Segoe UI', sans-serif" font-weight="bold" text-anchor="start">How wfindex maps to settings\ — the develop-XMP join</text>
<text x="40" y="82" font-size="15" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">one SQL index table turns anonymous sha256 files into named sidecars  ·  counts omitted — they vary per library</text>
<rect x="40" y="120" width="640" height="320" rx="14" fill="#161b22" stroke="#d2a8ff" stroke-width="2"/>
<text x="60" y="154" font-size="18" fill="#d2a8ff" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" text-anchor="start">Managed Catalog.wfindex  (SQLite, ~60 tables)</text>
<rect x="60" y="176" width="600" height="74" rx="14" fill="#0e1420" stroke="#30363d" stroke-width="2"/>
<text x="76" y="202" font-size="16" fill="#d2a8ff" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" text-anchor="start">purgeCandidates</text>
<text x="76" y="226" font-size="13.5" fill="#8b949e" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="normal" text-anchor="start">WHERE binaryType='xmp_develop'  →  one row per edit blob</text>
<rect x="60" y="262" width="600" height="74" rx="14" fill="#0e1420" stroke="#30363d" stroke-width="2"/>
<text x="76" y="288" font-size="16" fill="#58a6ff" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" text-anchor="start">assets</text>
<text x="76" y="312" font-size="13.5" fill="#8b949e" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="normal" text-anchor="start">assetId  →  filename · captureDate   (the photo's identity)</text>
<rect x="60" y="348" width="600" height="74" rx="14" fill="#0e1420" stroke="#30363d" stroke-width="2"/>
<text x="76" y="374" font-size="16" fill="#7ee787" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" text-anchor="start">assetPathsAndInfo</text>
<text x="76" y="398" font-size="13.5" fill="#8b949e" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="normal" text-anchor="start">docId column = assetId  →  originalRelativePath   (the folder)</text>
<rect x="760" y="176" width="380" height="200" rx="14" fill="#161b22" stroke="#ffa657" stroke-width="2"/>
<text x="778" y="208" font-size="19" fill="#ffa657" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" text-anchor="start">settings\</text>
<text x="778" y="236" font-size="15" fill="#e6edf3" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">one file per edit blob</text>
<text x="778" y="264" font-size="14" fill="#8b949e" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="normal" text-anchor="start">&lt;64-hex sha256&gt;</text>
<text x="778" y="292" font-size="13.5" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">bare &lt;x:xmpmeta&gt; develop</text>
<text x="778" y="314" font-size="13.5" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">settings — no extension,</text>
<text x="778" y="336" font-size="13.5" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">no envelope</text>
<line x1="662" y1="213" x2="756" y2="213" stroke="#ffa657" stroke-width="2" marker-end="url(#arr)"/>
<text x="1140" y="160" font-size="14" fill="#ffa657" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" text-anchor="end">contentIdOrSha256  IS  the file name</text>
<rect x="40" y="500" width="1100" height="120" rx="14" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
<text x="60" y="532" font-size="16" fill="#58a6ff" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" text-anchor="start">revisions</text>
<text x="60" y="558" font-size="15" fill="#e6edf3" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">one assetId can own several shas  →  sort by dateLastUpdatedInSeconds</text>
<text x="60" y="586" font-size="15" fill="#8b949e" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="normal" text-anchor="start">newest → DSC03049.xmp          older → DSC03049_&lt;sha6&gt;.xmp (_sha6 suffix)</text>
<line x1="778" y1="380" x2="778" y2="496" stroke="#e6edf3" stroke-width="2" marker-end="url(#arr)"/>
<line x1="370" y1="446" x2="370" y2="496" stroke="#e6edf3" stroke-width="2" marker-end="url(#arr)"/>
<rect x="40" y="690" width="520" height="110" rx="14" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
<text x="60" y="722" font-size="15" fill="#58a6ff" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" text-anchor="start">from assets</text>
<text x="60" y="748" font-size="15" fill="#e6edf3" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">filename → sidecar stem (DSC03049)</text>
<text x="60" y="774" font-size="13.5" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">byte-identical base name required</text>
<rect x="620" y="690" width="520" height="110" rx="14" fill="#161b22" stroke="#7ee787" stroke-width="2"/>
<text x="640" y="722" font-size="15" fill="#7ee787" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" text-anchor="start">from assetPathsAndInfo</text>
<text x="640" y="748" font-size="15" fill="#e6edf3" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="normal" text-anchor="start">originals\&lt;year&gt;\&lt;capture-date&gt;\</text>
<text x="640" y="774" font-size="13.5" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">the XMP goes where the RAW already is</text>
<line x1="370" y1="624" x2="300" y2="686" stroke="#e6edf3" stroke-width="2" marker-end="url(#arr)"/>
<line x1="778" y1="624" x2="880" y2="686" stroke="#e6edf3" stroke-width="2" marker-end="url(#arr)"/>
<rect x="280" y="870" width="620" height="90" rx="14" fill="#161b22" stroke="#d2a8ff" stroke-width="2"/>
<text x="300" y="900" font-size="16" fill="#d2a8ff" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" text-anchor="start">wrap()</text>
<text x="300" y="928" font-size="15" fill="#e6edf3" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="normal" text-anchor="start">add &lt;?xpacket?&gt; envelope around &lt;x:xmpmeta&gt;</text>
<line x1="300" y1="804" x2="430" y2="866" stroke="#e6edf3" stroke-width="2" marker-end="url(#arr)"/>
<line x1="880" y1="804" x2="750" y2="866" stroke="#e6edf3" stroke-width="2" marker-end="url(#arr)"/>
<rect x="160" y="1030" width="860" height="150" rx="14" fill="#1f1608" stroke="#ffa657" stroke-width="3"/>
<text x="180" y="1064" font-size="17" fill="#ffa657" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" text-anchor="start">originals\2025\2024-11-16\</text>
<text x="180" y="1096" font-size="21" fill="#e6edf3" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" text-anchor="start">DSC03049.ARW   +   DSC03049.xmp</text>
<text x="180" y="1128" font-size="14" fill="#8b949e" font-family="'Segoe UI', sans-serif" font-weight="normal" text-anchor="start">every edited photo is recovered this way</text>
<line x1="590" y1="964" x2="590" y2="1026" stroke="#ffa657" stroke-width="2" marker-end="url(#arr)"/>
<text x="700" y="1002" font-size="14" fill="#ffa657" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" text-anchor="middle">place beside the RAW</text>
<rect x="40" y="1210" width="1100" height="84" rx="14" fill="#161b22" stroke="#ff7b72" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="60" y="1238" font-size="14" fill="#ff7b72" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="bold" text-anchor="start">fallback joins (same sha space / different chains)</text>
<text x="60" y="1266" font-size="14" fill="#8b949e" font-family="Consolas, 'Cascadia Mono', monospace" font-weight="normal" text-anchor="start">externalDevelopSettings.docId→sha256 · versions.docId→assetId · localAuxTracker.digest → auxiliary\ zlib</text>
</svg>