<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="712" viewBox="0 0 1480 712" font-family="Consolas, 'Cascadia Mono', 'Courier New', monospace">
<rect width="1480" height="712" fill="#0d1117"/>
<text x="26" y="26" font-size="16" font-weight="bold" fill="#e6edf3">Develop XMP — internal structure</text>
<text x="26" y="54" font-size="14" xml:space="preserve"><tspan fill="#e6edf3">Anatomy of a develop XMP sidecar — real file, real offsets (DSC03049.xmp, 36,775 B)</tspan></text>
<text x="26" y="94" font-size="14" xml:space="preserve"><tspan fill="#ffa657">        no &lt;?xpacket?&gt; envelope — a bare sidecar, exactly as Lightroom's export writes it</tspan></text>
<text x="26" y="114" font-size="14" xml:space="preserve"><tspan fill="#d2a8ff">     0  </tspan><tspan fill="#7ee787">&lt;x:xmpmeta </tspan><tspan fill="#79c0ff">xmlns:x</tspan><tspan fill="#7ee787">=</tspan><tspan fill="#e6edf3">"adobe:ns:meta/"</tspan><tspan fill="#7ee787"> </tspan><tspan fill="#79c0ff">x:xmptk</tspan><tspan fill="#7ee787">=</tspan><tspan fill="#e6edf3">"Adobe XMP Core 7.0-c000 …"</tspan><tspan fill="#7ee787">&gt;</tspan></text>
<text x="26" y="134" font-size="14" xml:space="preserve"><tspan fill="#8b949e">        </tspan><tspan fill="#8b949e">wrapper + writing toolkit identity</tspan></text>
<text x="26" y="154" font-size="14" xml:space="preserve"><tspan fill="#d2a8ff">   110  </tspan><tspan fill="#7ee787">&lt;rdf:RDF </tspan><tspan fill="#79c0ff">xmlns:rdf</tspan><tspan fill="#7ee787">=</tspan><tspan fill="#e6edf3">"…/22-rdf-syntax-ns#"</tspan><tspan fill="#7ee787">&gt;</tspan></text>
<text x="26" y="174" font-size="14" xml:space="preserve"><tspan fill="#d2a8ff">   178  </tspan><tspan fill="#7ee787">&lt;rdf:Description </tspan><tspan fill="#79c0ff">rdf:about</tspan><tspan fill="#7ee787">=</tspan><tspan fill="#e6edf3">""</tspan><tspan fill="#7ee787"> </tspan><tspan fill="#79c0ff">xmlns:crs</tspan><tspan fill="#7ee787">=</tspan><tspan fill="#e6edf3">"…/camera-raw-settings/1.0/"</tspan><tspan fill="#7ee787">&gt;</tspan></text>
<text x="26" y="194" font-size="14" xml:space="preserve"><tspan fill="#8b949e">        </tspan><tspan fill="#8b949e">one edit = one Description; crs = Camera Raw Settings namespace</tspan></text>
<text x="26" y="234" font-size="14" xml:space="preserve"><tspan fill="#ffa657">        scalar attributes — the sliders (flat name="value")</tspan></text>
<text x="26" y="254" font-size="14" xml:space="preserve"><tspan fill="#79c0ff">            crs:ProcessVersion</tspan><tspan fill="#7ee787">=</tspan><tspan fill="#e6edf3">"15.4"</tspan><tspan fill="#7ee787">   </tspan><tspan fill="#79c0ff">crs:Version</tspan><tspan fill="#7ee787">=</tspan><tspan fill="#e6edf3">"19.0"</tspan></text>
<text x="26" y="274" font-size="14" xml:space="preserve"><tspan fill="#79c0ff">            crs:WhiteBalance</tspan><tspan fill="#7ee787">=</tspan><tspan fill="#e6edf3">"Custom"</tspan><tspan fill="#7ee787">  </tspan><tspan fill="#79c0ff">crs:Temperature</tspan><tspan fill="#7ee787">=</tspan><tspan fill="#e6edf3">"3300"</tspan><tspan fill="#7ee787">  </tspan><tspan fill="#79c0ff">crs:Tint</tspan><tspan fill="#7ee787">=</tspan><tspan fill="#e6edf3">"+5"</tspan></text>
<text x="26" y="294" font-size="14" xml:space="preserve"><tspan fill="#79c0ff">            crs:Exposure2012</tspan><tspan fill="#7ee787">=</tspan><tspan fill="#e6edf3">"-0.50"</tspan><tspan fill="#7ee787">  </tspan><tspan fill="#79c0ff">crs:Vibrance</tspan><tspan fill="#7ee787">=</tspan><tspan fill="#e6edf3">"+15"</tspan><tspan fill="#7ee787">  </tspan><tspan fill="#79c0ff">crs:Saturation</tspan><tspan fill="#7ee787">=</tspan><tspan fill="#e6edf3">"+5"</tspan></text>
<text x="26" y="314" font-size="14" xml:space="preserve"><tspan fill="#8b949e">            … 129 crs: scalar attributes in this file: tone, presence, HSL, detail, optics, crop</tspan></text>
<text x="26" y="354" font-size="14" xml:space="preserve"><tspan fill="#ffa657">        arrays &amp; structs — child elements, values in rdf containers</tspan></text>
<text x="26" y="374" font-size="14" xml:space="preserve"><tspan fill="#d2a8ff">  7467  </tspan><tspan fill="#7ee787">  &lt;crs:ToneCurvePV2012&gt;</tspan><tspan fill="#8b949e">      curves: rdf:Seq of "x, y" points</tspan></text>
<text x="26" y="394" font-size="14" xml:space="preserve"><tspan fill="#7ee787">              &lt;rdf:Seq&gt;</tspan><tspan fill="#7ee787">&lt;rdf:li&gt;</tspan><tspan fill="#e6edf3">0, 0</tspan><tspan fill="#7ee787">&lt;/rdf:li&gt;</tspan><tspan fill="#7ee787">&lt;rdf:li&gt;</tspan><tspan fill="#e6edf3">62, 48</tspan><tspan fill="#7ee787">&lt;/rdf:li&gt;</tspan><tspan fill="#7ee787">&lt;rdf:li&gt;</tspan><tspan fill="#e6edf3">126, 116</tspan><tspan fill="#7ee787">&lt;/rdf:li&gt;</tspan><tspan fill="#7ee787">&lt;rdf:li&gt;</tspan><tspan fill="#e6edf3">255, 255</tspan><tspan fill="#7ee787">&lt;/rdf:li&gt;</tspan><tspan fill="#7ee787">&lt;/rdf:Seq&gt;</tspan></text>
<text x="26" y="414" font-size="14" xml:space="preserve"><tspan fill="#d2a8ff">  9055  </tspan><tspan fill="#7ee787">  &lt;crs:RemoveAreas&gt;</tspan><tspan fill="#8b949e">            what Remove / Generative Remove erases: AI object mask + brush, by MaskDigest</tspan></text>
<text x="26" y="434" font-size="14" xml:space="preserve"><tspan fill="#d2a8ff"> 16252  </tspan><tspan fill="#ffa657">  &lt;crs:MaskGroupBasedCorrections&gt;   masks: Seq of nested Descriptions</tspan></text>
<text x="26" y="454" font-size="14" xml:space="preserve"><tspan fill="#7ee787">              &lt;rdf:li&gt;&lt;rdf:Description </tspan><tspan fill="#79c0ff">crs:What</tspan><tspan fill="#7ee787">=</tspan><tspan fill="#e6edf3">"Correction"</tspan></text>
<text x="26" y="474" font-size="14" xml:space="preserve"><tspan fill="#79c0ff">                crs:CorrectionName</tspan><tspan fill="#7ee787">=</tspan><tspan fill="#e6edf3">"Mask 1"</tspan><tspan fill="#7ee787">  </tspan><tspan fill="#79c0ff">crs:CorrectionActive</tspan><tspan fill="#7ee787">=</tspan><tspan fill="#e6edf3">"true"</tspan></text>
<text x="26" y="494" font-size="14" xml:space="preserve"><tspan fill="#79c0ff">                crs:CorrectionSyncID</tspan><tspan fill="#7ee787">=</tspan><tspan fill="#e6edf3">"7340952010ECF344…"</tspan><tspan fill="#8b949e">  (8 groups: Mask 1, Mask 2, Mask 3, …)</tspan></text>
<text x="26" y="514" font-size="14" xml:space="preserve"><tspan fill="#8b949e">                &lt;crs:CorrectionMasks&gt; … brush/radial/linear/AI geometry + LumEq range curves</tspan></text>
<text x="26" y="534" font-size="14" xml:space="preserve"><tspan fill="#7ee787">              &lt;/rdf:Description&gt;&lt;/rdf:li&gt;</tspan></text>
<text x="26" y="574" font-size="14" xml:space="preserve"><tspan fill="#d2a8ff"> 36751  </tspan><tspan fill="#7ee787">&lt;/rdf:RDF&gt;</tspan></text>
<text x="26" y="594" font-size="14" xml:space="preserve"><tspan fill="#d2a8ff"> 36762  </tspan><tspan fill="#7ee787">&lt;/x:xmpmeta&gt;</tspan></text>
<text x="26" y="634" font-size="14" xml:space="preserve"><tspan fill="#ffa657">rules:</tspan><tspan fill="#8b949e">  flat slider → attribute   ·   list/curve → rdf:Seq   ·   bag/unordered → rdf:Bag</tspan></text>
<text x="26" y="654" font-size="14" xml:space="preserve"><tspan fill="#8b949e">          mask = nested rdf:Description inside a Seq (16 nested, 28 rdf:Seq here)   ·   settings\ store = same bare XML</tspan></text>
</svg>