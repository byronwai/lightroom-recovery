<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="732" viewBox="0 0 1480 732" font-family="Consolas, 'Cascadia Mono', 'Courier New', monospace">
<rect width="1480" height="732" fill="#0d1117"/>
<text x="26" y="26" font-size="16" font-weight="bold" fill="#e6edf3">Develop XMP — internal structure</text>
<text x="26" y="54" font-size="14" xml:space="preserve"><tspan fill="#e6edf3">Anatomy of a develop XMP sidecar — real file, real offsets (DSC08974.xmp, 24,340 B)</tspan></text>
<text x="26" y="94" font-size="14" xml:space="preserve"><tspan fill="#d2a8ff">     0  </tspan><tspan fill="#7ee787">&lt;?xpacket </tspan><tspan fill="#79c0ff">begin</tspan><tspan fill="#7ee787">=</tspan><tspan fill="#e6edf3">"&lt;BOM&gt;"</tspan><tspan fill="#7ee787"> </tspan><tspan fill="#79c0ff">id</tspan><tspan fill="#7ee787">=</tspan><tspan fill="#e6edf3">"W5M0MpCehiHzreSzNTczkc9d"</tspan><tspan fill="#7ee787">?&gt;</tspan></text>
<text x="26" y="134" font-size="14" xml:space="preserve"><tspan fill="#d2a8ff">    54  </tspan><tspan fill="#7ee787">&lt;x:xmpmeta </tspan><tspan fill="#79c0ff">xmlns:x</tspan><tspan fill="#7ee787">=</tspan><tspan fill="#e6edf3">"adobe:ns:meta/"</tspan><tspan fill="#7ee787"> </tspan><tspan fill="#79c0ff">x:xmptk</tspan><tspan fill="#7ee787">=</tspan><tspan fill="#e6edf3">"Adobe XMP Core 7.0-c000 …"</tspan><tspan fill="#7ee787">&gt;</tspan></text>
<text x="26" y="174" font-size="14" xml:space="preserve"><tspan fill="#d2a8ff">   164  </tspan><tspan fill="#7ee787">&lt;rdf:RDF </tspan><tspan fill="#79c0ff">xmlns:rdf</tspan><tspan fill="#7ee787">=</tspan><tspan fill="#e6edf3">"…/22-rdf-syntax-ns#"</tspan><tspan fill="#7ee787">&gt;</tspan></text>
<text x="26" y="194" font-size="14" xml:space="preserve"><tspan fill="#d2a8ff">   232  </tspan><tspan fill="#7ee787">&lt;rdf:Description </tspan><tspan fill="#79c0ff">rdf:about</tspan><tspan fill="#7ee787">=</tspan><tspan fill="#e6edf3">""</tspan><tspan fill="#7ee787"> </tspan><tspan fill="#79c0ff">xmlns:crs</tspan><tspan fill="#7ee787">=</tspan><tspan fill="#e6edf3">"…/camera-raw-settings/1.0/"</tspan><tspan fill="#7ee787">&gt;</tspan></text>
<text x="26" y="254" font-size="14" xml:space="preserve"><tspan fill="#ffa657">        scalar attributes — the sliders (flat name="value")</tspan></text>
<text x="26" y="274" font-size="14" xml:space="preserve"><tspan fill="#79c0ff">            crs:ProcessVersion</tspan><tspan fill="#7ee787">=</tspan><tspan fill="#e6edf3">"15.4"</tspan><tspan fill="#7ee787">   </tspan><tspan fill="#79c0ff">crs:Version</tspan><tspan fill="#7ee787">=</tspan><tspan fill="#e6edf3">"18.5.1"</tspan></text>
<text x="26" y="294" font-size="14" xml:space="preserve"><tspan fill="#79c0ff">            crs:WhiteBalance</tspan><tspan fill="#7ee787">=</tspan><tspan fill="#e6edf3">"Custom"</tspan><tspan fill="#7ee787">  </tspan><tspan fill="#79c0ff">crs:Temperature</tspan><tspan fill="#7ee787">=</tspan><tspan fill="#e6edf3">"5200"</tspan><tspan fill="#7ee787">  </tspan><tspan fill="#79c0ff">crs:Tint</tspan><tspan fill="#7ee787">=</tspan><tspan fill="#e6edf3">"+13"</tspan></text>
<text x="26" y="314" font-size="14" xml:space="preserve"><tspan fill="#79c0ff">            crs:Exposure2012</tspan><tspan fill="#7ee787">=</tspan><tspan fill="#e6edf3">"0.00"</tspan><tspan fill="#7ee787">  </tspan><tspan fill="#79c0ff">crs:Vibrance</tspan><tspan fill="#7ee787">=</tspan><tspan fill="#e6edf3">"+15"</tspan><tspan fill="#7ee787">  </tspan><tspan fill="#79c0ff">crs:Saturation</tspan><tspan fill="#7ee787">=</tspan><tspan fill="#e6edf3">"+5"</tspan></text>
<text x="26" y="334" font-size="14" xml:space="preserve"><tspan fill="#8b949e">            … 178 scalar attributes in this file: tone, presence, HSL, detail, optics, crop</tspan></text>
<text x="26" y="374" font-size="14" xml:space="preserve"><tspan fill="#ffa657">        arrays &amp; structs — child elements, values in rdf containers</tspan></text>
<text x="26" y="394" font-size="14" xml:space="preserve"><tspan fill="#d2a8ff">  4098  </tspan><tspan fill="#7ee787">  &lt;crs:ToneCurvePV2012&gt;</tspan><tspan fill="#8b949e">      curves: rdf:Seq of "x, y" points</tspan></text>
<text x="26" y="414" font-size="14" xml:space="preserve"><tspan fill="#7ee787">              &lt;rdf:Seq&gt;&lt;rdf:li&gt;</tspan><tspan fill="#e6edf3">0, 0</tspan><tspan fill="#7ee787">&lt;/rdf:li&gt;&lt;rdf:li&gt;</tspan><tspan fill="#e6edf3">255, 255</tspan><tspan fill="#7ee787">&lt;/rdf:li&gt;&lt;/rdf:Seq&gt;</tspan></text>
<text x="26" y="434" font-size="14" xml:space="preserve"><tspan fill="#d2a8ff">  5085  </tspan><tspan fill="#ffa657">  &lt;crs:MaskGroupBasedCorrections&gt;   masks: Seq of nested Descriptions</tspan></text>
<text x="26" y="454" font-size="14" xml:space="preserve"><tspan fill="#7ee787">              &lt;rdf:li&gt;&lt;rdf:Description </tspan><tspan fill="#79c0ff">crs:What</tspan><tspan fill="#7ee787">=</tspan><tspan fill="#e6edf3">"Correction"</tspan></text>
<text x="26" y="474" font-size="14" xml:space="preserve"><tspan fill="#79c0ff">                crs:CorrectionName</tspan><tspan fill="#7ee787">=</tspan><tspan fill="#e6edf3">"Water"</tspan><tspan fill="#7ee787">  </tspan><tspan fill="#79c0ff">crs:CorrectionActive</tspan><tspan fill="#7ee787">=</tspan><tspan fill="#e6edf3">"true"</tspan></text>
<text x="26" y="494" font-size="14" xml:space="preserve"><tspan fill="#79c0ff">                crs:CorrectionSyncID</tspan><tspan fill="#7ee787">=</tspan><tspan fill="#e6edf3">"178CE3C8FA3715C7…"</tspan><tspan fill="#8b949e">  (7 groups: Water, Sky, …)</tspan></text>
<text x="26" y="514" font-size="14" xml:space="preserve"><tspan fill="#8b949e">                &lt;crs:CorrectionMasks&gt; … brush/radial/linear/AI geometry + LumEq range curves</tspan></text>
<text x="26" y="534" font-size="14" xml:space="preserve"><tspan fill="#7ee787">              &lt;/rdf:Description&gt;&lt;/rdf:li&gt;</tspan></text>
<text x="26" y="554" font-size="14" xml:space="preserve"><tspan fill="#8b949e">          &lt;crs:RangeMaskMapInfo&gt; … &lt;/crs:RangeMaskMapInfo&gt;     nested masks carry their own curves</tspan></text>
<text x="26" y="594" font-size="14" xml:space="preserve"><tspan fill="#d2a8ff"> 24297  </tspan><tspan fill="#7ee787">&lt;/rdf:RDF&gt;&lt;/x:xmpmeta&gt;</tspan></text>
<text x="26" y="614" font-size="14" xml:space="preserve"><tspan fill="#d2a8ff"> 24321  </tspan><tspan fill="#7ee787">&lt;?xpacket end=</tspan><tspan fill="#e6edf3">"w"</tspan><tspan fill="#7ee787">?&gt;</tspan><tspan fill="#7ee787">   </tspan><tspan fill="#8b949e">"w" = in-place rewrite allowed; tail padding enables it</tspan></text>
<text x="26" y="654" font-size="14" xml:space="preserve"><tspan fill="#ffa657">rules:</tspan><tspan fill="#8b949e">  flat slider → attribute   ·   list/curve → rdf:Seq   ·   bag/unordered → rdf:Bag</tspan></text>
<text x="26" y="674" font-size="14" xml:space="preserve"><tspan fill="#8b949e">          mask = nested rdf:Description inside a Seq   ·   settings\ store = same XML minus the envelope</tspan></text>
</svg>